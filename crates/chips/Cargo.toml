[package]
name = "chips"
description = "Where the pane is, what branch it is on, and what a chord would do."
authors.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `cdylib` is the plugin; `rlib` is so that `cargo test` can link the same code
# against the host's target and run everything that is not an import.
crate-type = ["cdylib", "rlib"]

[dependencies]
crook_plugin_api.workspace = true
